<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c33"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0231a"/>
      <stop offset="1" stop-color="#8a0c07"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824 px body on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- the floating card -->
  <g filter="url(#shadow)">
    <rect x="232" y="232" width="560" height="560" rx="72" fill="#000" stroke="#ffffff" stroke-opacity=".18" stroke-width="6"/>
    <rect x="262" y="262" width="500" height="380" rx="52" fill="url(#art)"/>
  </g>
  <!-- lyric lines: dim / highlighted / dim -->
  <rect x="352" y="352" width="320" height="30" rx="15" fill="#fff" fill-opacity=".38"/>
  <rect x="322" y="437" width="380" height="42" rx="21" fill="#fff"/>
  <rect x="372" y="534" width="280" height="30" rx="15" fill="#fff" fill-opacity=".38"/>
  <!-- title / artist -->
  <rect x="292" y="680" width="260" height="30" rx="15" fill="#fff"/>
  <rect x="292" y="732" width="170" height="22" rx="11" fill="#b3b3b3"/>
</svg>
