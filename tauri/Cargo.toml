[package]
name = "float"
version = "0.0.0" # placeholder: releases take their version from the git tag
description = "Floating synced-lyrics mini player for Spotify on macOS"
edition = "2021"

[lib]
name = "float_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-oauth = "2.1.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
