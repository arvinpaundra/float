name: Release

# Tag a version and push it:  git tag v0.2.1 && git push origin v0.2.1
# Builds macOS (universal) and Linux (AppImage), then publishes the release install.sh downloads.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # manual run: builds and publishes from the current default branch

permissions:
  contents: write # gh release create

env:
  BUN_VERSION: 1.3.10

jobs:
  macos:
    runs-on: macos-15 # Apple Silicon runner; the x86_64 target is added for the universal build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          key: macos

      # The Spotify Client ID is inlined into the UI bundle at build time (see .env.example).
      - name: Write .env
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || { echo "::error::repository secret SPOTIFY_CLIENT_ID is not set"; exit 1; }
          echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" > .env

      # A tag must match the version in tauri.conf.json, or install.sh's
      # <base>/download/v<version>/ layout would not resolve.
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' tauri/tauri.conf.json | head -1)"
          [ "$version" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      # Same script as a local release: checks, universal build, zip + dmg (manifest is written in `publish`).
      - run: scripts/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: dist/v*/*
          retention-days: 7

  linux:
    runs-on: ubuntu-22.04 # oldest supported glibc: an AppImage built here runs on newer distros too
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          key: linux

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Write .env
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || { echo "::error::repository secret SPOTIFY_CLIENT_ID is not set"; exit 1; }
          echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" > .env

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run tauri build --bundles appimage

      - name: Collect the AppImage
        run: |
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' tauri/tauri.conf.json | head -1)"
          mkdir -p dist
          cp tauri/target/release/bundle/appimage/*.AppImage "dist/float-$version-linux-x86_64.AppImage"
          cp tauri/icons/128x128.png dist/float-icon-128.png # used by the .desktop entry
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: dist/*
          retention-days: 7

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble the release
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' tauri/tauri.conf.json | head -1)"
          scripts/manifest.sh "$version" out/* > out/manifest.json
          echo "VERSION=$version" >> "$GITHUB_ENV"
          cat out/manifest.json
          ls -lh out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" out/* --title "float $VERSION" --generate-notes
