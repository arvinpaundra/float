name: Release

# Releasing is one command:  git tag v0.2.1 && git push origin v0.2.1
# The tag IS the version — nothing in the repo stores it.
# Builds macOS (universal) and Linux (AppImage), then publishes the release install.sh downloads.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # manual run: build and publish this version
    inputs:
      version:
        description: Version to build and publish, e.g. 0.2.1
        required: true

permissions:
  contents: write # gh release create

env:
  BUN_VERSION: 1.3.10
  # tag run → refs/tags/v0.2.1 → 0.2.1; manual run → the version you typed
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  macos:
    if: false # temporarily off while iterating on the Linux AppImage; delete this line to restore
    runs-on: macos-15 # Apple Silicon runner; the x86_64 target is added for the universal build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          key: macos

      # The Spotify Client ID is inlined into the UI bundle at build time (see .env.example).
      - name: Write .env
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || { echo "::error::repository secret SPOTIFY_CLIENT_ID is not set"; exit 1; }
          echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" > .env

      # Same script as a local release: checks, universal build, zip + dmg (the manifest is written in `publish`).
      - run: scripts/release.sh --version "${VERSION#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: dist/v*/*
          retention-days: 7

  linux:
    runs-on: ubuntu-22.04 # oldest supported glibc: an AppImage built here runs on newer distros too
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          key: linux

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Write .env
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || { echo "::error::repository secret SPOTIFY_CLIENT_ID is not set"; exit 1; }
          echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" > .env

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run tauri build --bundles appimage --config "{\"version\":\"${VERSION#v}\"}"

      # Bundling these shadows the host's copies via AppRun's LD_LIBRARY_PATH, and a newer Mesa then
      # fails EGL display creation, killing WebKitWebProcess. The AppImage excludelist says never to
      # ship them; linuxdeploy's own list misses the wayland/xcb set, so remove them here.
      - name: Unbundle host-provided libraries
        run: |
          cd tauri/target/release/bundle/appimage
          app="$(ls *.AppImage)"
          ./"$app" --appimage-extract >/dev/null
          find squashfs-root/usr/lib -maxdepth 2 \( \
               -name 'libwayland-*.so.*' -o -name 'libxkbcommon.so.*' -o \
               -name 'libxcb-randr.so.*' -o -name 'libxcb-render.so.*' -o \
               -name 'libxcb-shm.so.*'   -o -name 'libXau.so.*'       -o \
               -name 'libXdmcp.so.*' \) -print -delete
          # pinned: `continuous` moves, and a release must stay reproducible
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          rm -f "$app"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool-x86_64.AppImage squashfs-root "$app"
          ls -lh "$app"

      - name: Collect the AppImage
        run: |
          mkdir -p dist
          cp tauri/target/release/bundle/appimage/*.AppImage "dist/float-${VERSION#v}-linux-x86_64.AppImage"
          cp tauri/icons/128x128.png dist/float-icon-128.png # used by the .desktop entry
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: dist/*
          retention-days: 7

  publish:
    needs: [macos, linux]
    if: always() && needs.linux.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble the release
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          scripts/manifest.sh "${VERSION#v}" out/* > out/manifest.json
          cat out/manifest.json
          ls -lh out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          # no macOS build in this release: keep "latest" (what install.sh resolves) on the last full one
          ls out/*darwin-universal.zip >/dev/null 2>&1 || args+=(--prerelease)
          gh release create "v${VERSION#v}" out/* --title "float ${VERSION#v}" --generate-notes "${args[@]}"
