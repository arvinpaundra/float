name: Release

# Tag a version and push it:  git tag v0.1.2 && git push origin v0.1.2
# Builds the universal app and publishes the GitHub release that install.sh downloads.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # manual run: builds and publishes from the current default branch

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: macos-15 # Apple Silicon runner; the x86_64 target is added below for the universal build
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri

      # The Spotify Client ID is inlined into the UI bundle at build time (see .env.example).
      - name: Write .env
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || { echo "::error::repository secret SPOTIFY_CLIENT_ID is not set"; exit 1; }
          echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" > .env

      # A tag must match the version in tauri.conf.json / package.json, or install.sh's
      # <base>/download/v<version>/ layout would not resolve.
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' tauri/tauri.conf.json | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          [ "$version" = "$tag" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      # Same script as a local release: checks, universal build, zip + manifest.json + dmg, gh release create.
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh --publish

      - uses: actions/upload-artifact@v4
        with:
          name: float-dist
          path: dist/
