name: Release

# Releasing is one command:  git tag v0.2.1 && git push origin v0.2.1
# The tag IS the version — nothing in the repo stores it (see .github/version.sh).
# Builds macOS (universal) and Linux (AppImage), then publishes the release install.sh downloads.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # manual run: rebuilds and republishes the latest tag

permissions:
  contents: write # gh release create

env:
  BUN_VERSION: 1.3.10

jobs:
  macos:
    runs-on: macos-15 # Apple Silicon runner; the x86_64 target is added for the universal build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for version.sh on manual runs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          key: macos

      # The Spotify Client ID is inlined into the UI bundle at build time (see .env.example).
      - name: Write .env
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || { echo "::error::repository secret SPOTIFY_CLIENT_ID is not set"; exit 1; }
          echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" > .env

      - name: Resolve version
        run: echo "VERSION=$(.github/version.sh)" >> "$GITHUB_ENV"

      # Same script as a local release: checks, universal build, zip + dmg (the manifest is written in `publish`).
      - run: scripts/release.sh --version "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: dist/v*/*
          retention-days: 7

  linux:
    runs-on: ubuntu-22.04 # oldest supported glibc: an AppImage built here runs on newer distros too
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          key: linux

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Write .env
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          test -n "$SPOTIFY_CLIENT_ID" || { echo "::error::repository secret SPOTIFY_CLIENT_ID is not set"; exit 1; }
          echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" > .env

      - name: Resolve version
        run: echo "VERSION=$(.github/version.sh)" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run tauri build --bundles appimage --config "{\"version\":\"$VERSION\"}"

      - name: Collect the AppImage
        run: |
          mkdir -p dist
          cp tauri/target/release/bundle/appimage/*.AppImage "dist/float-$VERSION-linux-x86_64.AppImage"
          cp tauri/icons/128x128.png dist/float-icon-128.png # used by the .desktop entry
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: dist/*
          retention-days: 7

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble the release
        run: |
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          echo "VERSION=$(.github/version.sh)" >> "$GITHUB_ENV"
          scripts/manifest.sh "$(.github/version.sh)" out/* > out/manifest.json
          cat out/manifest.json
          ls -lh out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" out/* --title "float $VERSION" --generate-notes
